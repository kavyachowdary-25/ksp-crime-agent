<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KSP Crime Intelligence — Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root {
  --ink: #0e1420;
  --panel: #151d2c;
  --panel-2: #1a2436;
  --line: #26314a;
  --paper: #e9edf4;
  --dim: #8a97ad;
  --brass: #e8a33d;
  --red: #e4573d;
  --cyan: #5fb4c9;
  --font-display: "Barlow Condensed", sans-serif;
  --font-body: "IBM Plex Sans", sans-serif;
  --font-mono: "IBM Plex Mono", monospace;
}
* { box-sizing: border-box; margin: 0; }
html, body { background: var(--ink); color: var(--paper); font-family: var(--font-body); font-size: 14px; }
a { color: var(--cyan); }

.wrap { max-width: 1400px; margin: 0 auto; padding: 0 20px 60px; }

nav.platform { display: flex; gap: 2px; padding-top: 14px; }
nav.platform a {
  font-family: var(--font-display); font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em;
  font-size: 13px; text-decoration: none; color: var(--dim); padding: 7px 16px;
  border: 1px solid var(--line); border-bottom: 0; background: var(--panel);
}
nav.platform a.here { color: var(--brass); background: var(--panel-2); }
nav.platform a:hover { color: var(--paper); }
header.top {
  display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px;
  padding: 18px 0 14px; border-bottom: 1px solid var(--line);
}
.wordmark { font-family: var(--font-display); font-weight: 600; font-size: 26px; letter-spacing: 0.06em; text-transform: uppercase; }
.wordmark .sub { color: var(--brass); }
.nav { display: flex; gap: 2px; margin-left: auto; margin-right: 16px; }
.nav a {
  font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.08em; font-size: 14px;
  color: var(--dim); text-decoration: none; padding: 6px 14px; border: 1px solid var(--line);
}
.nav a.here { color: var(--ink); background: var(--brass); border-color: var(--brass); }
.nav a:not(.here):hover { color: var(--paper); }
.stamp { font-family: var(--font-mono); font-size: 12px; color: var(--dim); border: 1px solid var(--line); padding: 4px 10px; }
.stamp b { color: var(--paper); font-weight: 500; }

.controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding: 14px 0; }
.controls label { font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.08em; font-size: 13px; color: var(--dim); }
select {
  background: var(--panel-2); color: var(--paper); border: 1px solid var(--line);
  font-family: var(--font-mono); font-size: 12px; padding: 6px 8px; min-width: 150px;
}
select:focus-visible, button:focus-visible, input[type=date]:focus-visible { outline: 2px solid var(--cyan); outline-offset: 1px; }
input[type=date] {
  background: var(--panel-2); color: var(--paper); border: 1px solid var(--line);
  font-family: var(--font-mono); font-size: 12px; padding: 5px 8px; color-scheme: dark;
}
button.toggle {
  background: none; border: 1px solid var(--line); color: var(--dim); font-family: var(--font-mono);
  font-size: 12px; padding: 6px 12px; cursor: pointer;
}
button.toggle.on { color: var(--ink); background: var(--red); border-color: var(--red); font-weight: 500; }
button.toggle:not(.on):hover { color: var(--paper); border-color: var(--dim); }
button.reset {
  background: none; border: 1px solid var(--line); color: var(--dim); font-family: var(--font-mono);
  font-size: 12px; padding: 6px 12px; cursor: pointer;
}
button.reset:hover { color: var(--paper); border-color: var(--dim); }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); margin-bottom: 20px; }
.kpi { background: var(--panel); padding: 14px 16px; }
.kpi .n { font-family: var(--font-mono); font-size: 26px; font-weight: 500; }
.kpi .l { font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.1em; font-size: 12px; color: var(--dim); margin-top: 2px; }
.kpi.alert .n { color: var(--red); }

.grid { display: grid; grid-template-columns: 1fr 340px; gap: 20px; }
@media (max-width: 980px) { .grid { grid-template-columns: 1fr; } }

.panel { background: var(--panel); border: 1px solid var(--line); }
.panel h2 {
  font-family: var(--font-display); font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em;
  font-size: 15px; padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center;
}
.panel h2 .meta { font-family: var(--font-mono); font-size: 11px; color: var(--dim); text-transform: none; letter-spacing: 0; }
.panel .body { padding: 16px; }

#map { height: 480px; }
.map-toggles { display: flex; gap: 6px; }
.map-toggles button {
  background: var(--panel-2); border: 1px solid var(--line); color: var(--dim);
  font-family: var(--font-mono); font-size: 11px; padding: 4px 10px; cursor: pointer;
}
.map-toggles button.on { color: var(--ink); background: var(--brass); border-color: var(--brass); }

.spike-rail { display: flex; flex-direction: column; }
details.off { border-bottom: 1px solid var(--line); }
details.off:last-child { border-bottom: 0; }
details.off summary { list-style: none; cursor: pointer; padding: 10px 16px; display: flex; gap: 10px; align-items: baseline; }
details.off summary::-webkit-details-marker { display: none; }
details.off summary .nm { font-weight: 600; }
details.off summary .ct { font-family: var(--font-mono); font-size: 12px; color: var(--brass); }
details.off summary .xj {
  font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.06em; font-size: 11px;
  color: var(--red); border: 1px solid var(--red); padding: 1px 6px; margin-left: auto;
}
details.off summary .mo { font-size: 12px; color: var(--dim); }
.off-timeline { padding: 0 16px 12px; font-family: var(--font-mono); font-size: 11.5px; color: var(--dim); }
.off-timeline div { padding: 3px 0; border-top: 1px dashed var(--line); }
.off-timeline b { color: var(--paper); font-weight: 500; }
.spike { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: flex-start; }
.spike:last-child { border-bottom: 0; }
.spike .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 4px; flex: none; background: var(--dim); }
.spike.hot .dot { background: var(--red); animation: pulse 1.6s ease-out infinite; }
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(228, 87, 61, 0.55); }
  100% { box-shadow: 0 0 0 12px rgba(228, 87, 61, 0); }
}
@media (prefers-reduced-motion: reduce) { .spike.hot .dot { animation: none; } }
.spike .where { font-weight: 600; }
.spike .what { color: var(--dim); font-size: 13px; }
.spike .nums { margin-left: auto; text-align: right; font-family: var(--font-mono); font-size: 12px; flex: none; }
.spike .z { color: var(--red); }
.spike.watch .z { color: var(--brass); }
.empty { padding: 20px 16px; color: var(--dim); font-size: 13px; }

.charts { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-top: 20px; }
@media (max-width: 980px) { .charts { grid-template-columns: 1fr; } }
.chart-box { position: relative; height: 260px; }

.matrix-wrap { overflow-x: auto; }
table.matrix { border-collapse: collapse; width: 100%; font-family: var(--font-mono); font-size: 12px; }
table.matrix th {
  font-family: var(--font-display); font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em;
  font-size: 12px; color: var(--dim); text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line);
}
table.matrix th.b { text-align: center; }
table.matrix td { padding: 0; border: 1px solid var(--ink); }
table.matrix td.station { padding: 8px 10px; white-space: nowrap; background: var(--panel); border: 0; border-bottom: 1px solid var(--line); }
table.matrix td.station .d { color: var(--dim); font-size: 11px; }
.cell { display: block; text-align: center; padding: 10px 6px; color: var(--paper); }
.cell.flag { box-shadow: inset 0 0 0 2px var(--brass); }
.cell.flag2 { box-shadow: inset 0 0 0 2px var(--red); }
.legend { display: flex; gap: 16px; padding: 10px 16px; border-top: 1px solid var(--line); font-family: var(--font-mono); font-size: 11px; color: var(--dim); flex-wrap: wrap; }
.legend .sw { display: inline-block; width: 12px; height: 12px; vertical-align: -2px; margin-right: 6px; }

.risk-row { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.risk-row:last-child { border-bottom: 0; }
.risk-score { font-family: var(--font-mono); font-size: 16px; font-weight: 500; text-align: center; padding: 6px 0; }
.risk-score.hi { color: var(--red); box-shadow: inset 0 0 0 1px var(--red); }
.risk-score.med { color: var(--brass); box-shadow: inset 0 0 0 1px var(--brass); }
.risk-score.lo { color: var(--dim); box-shadow: inset 0 0 0 1px var(--line); }
.risk-row .who { min-width: 0; }
.risk-row .who .d { color: var(--dim); font-size: 12px; }
.risk-row .fc { font-family: var(--font-mono); font-size: 12px; text-align: right; color: var(--dim); }
.risk-row .fc b { color: var(--paper); font-weight: 500; }
.anom { padding: 12px 16px; border-bottom: 1px solid var(--line); }
.anom:last-child { border-bottom: 0; }
.anom .head { display: flex; justify-content: space-between; gap: 10px; font-family: var(--font-mono); font-size: 12px; }
.anom .head .no { color: var(--cyan); text-decoration: none; }
.anom .head .no:hover { text-decoration: underline; }
.anom .head .sc { color: var(--brass); }
.anom .what { font-size: 13px; margin: 3px 0 5px; }
.anom .why { color: var(--dim); font-size: 12px; line-height: 1.5; }
.anom .why span::before { content: "\2192  "; color: var(--brass); }
.anom .why span { display: block; }

.off { border-bottom: 1px solid var(--line); }
.off:last-child { border-bottom: 0; }
.off summary { list-style: none; cursor: pointer; padding: 12px 16px; display: grid;
  grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: baseline; }
.off summary::-webkit-details-marker { display: none; }
.off summary:hover { background: var(--panel-2); }
.off .who { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.off .who .pid { font-family: var(--font-mono); font-size: 11px; color: var(--dim); font-weight: 400; }
.off .stats { font-family: var(--font-mono); font-size: 12px; text-align: right; color: var(--dim); white-space: nowrap; }
.off .stats b { color: var(--paper); font-weight: 500; }
.off .tags { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-family: var(--font-mono); font-size: 11px; padding: 2px 8px; border: 1px solid var(--line); color: var(--dim); }
.tag.xj { color: var(--red); border-color: var(--red); }
.tag.mo { color: var(--brass); border-color: var(--brass); }
.off .timeline { padding: 0 16px 12px; }
.off .timeline .tl-row { display: grid; grid-template-columns: 90px 1fr auto; gap: 10px;
  font-family: var(--font-mono); font-size: 12px; padding: 5px 0; border-top: 1px dashed var(--line); }
.off .timeline .tl-row .st { color: var(--dim); }
.socio-corr { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border-bottom: 1px solid var(--line); }
.socio-corr .c { background: var(--panel); padding: 12px; text-align: center; }
.socio-corr .c .v { font-family: var(--font-mono); font-size: 20px; }
.socio-corr .c .l { font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.08em; font-size: 11px; color: var(--dim); margin-top: 2px; }
table.socio { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 12px; }
table.socio th { font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.08em; font-size: 11px;
  color: var(--dim); text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); }
table.socio td { padding: 7px 12px; border-bottom: 1px solid var(--line); }
table.socio tr:last-child td { border-bottom: 0; }
table.socio .num { text-align: right; }
.ratebar { display: inline-block; height: 8px; background: var(--cyan); vertical-align: middle; margin-right: 6px; }
.caveat { padding: 10px 16px; border-top: 1px solid var(--line); color: var(--dim); font-size: 11px; font-family: var(--font-mono); }

.tri { display: grid; grid-template-columns: 64px 1fr; gap: 4px 14px; padding: 11px 16px; border-bottom: 1px solid var(--line); align-items: center; }
.tri:last-child { border-bottom: 0; }
.tri .p { font-family: var(--font-mono); font-size: 15px; color: var(--red); text-align: right; }
.tri .p.med { color: var(--brass); }
.tri .info { font-family: var(--font-mono); font-size: 12px; }
.tri .info .meta2 { color: var(--dim); }
.tri .bar { grid-column: 1; height: 4px; background: var(--panel-2); }
.tri .bar i { display: block; height: 100%; background: var(--red); }
.tri .drv { grid-column: 2; display: flex; flex-wrap: wrap; gap: 6px; }
.tri .drv span { font-family: var(--font-mono); font-size: 10.5px; padding: 1px 7px; border: 1px solid var(--line); color: var(--dim); }
.tri .drv span.up { border-color: var(--red); color: var(--red); }
.mlcard { display: flex; gap: 18px; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid var(--line); font-family: var(--font-mono); font-size: 11.5px; color: var(--dim); }
.mlcard b { color: var(--paper); font-weight: 500; }

.scrub { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-top: 1px solid var(--line); font-family: var(--font-mono); font-size: 12px; }
.scrub button { background: var(--panel-2); border: 1px solid var(--line); color: var(--paper); font-family: var(--font-mono); font-size: 12px; padding: 4px 12px; cursor: pointer; }
.scrub button:hover { border-color: var(--dim); }
.scrub button:disabled, .scrub input:disabled { opacity: 0.35; cursor: default; }
.scrub button.playing { background: var(--brass); color: var(--ink); border-color: var(--brass); }
.scrub input[type=range] { flex: 1; accent-color: var(--brass); }
.scrub .lbl { min-width: 76px; color: var(--brass); text-align: right; }

.dv-ov { position: fixed; inset: 0; background: rgba(8,12,20,0.55); z-index: 40; }
.dv { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 92vw); z-index: 41;
  background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column;
  transform: translateX(100%); transition: transform 0.22s ease; }
.dv.open { transform: none; }
@media (prefers-reduced-motion: reduce) { .dv { transition: none; } }
.dv header { display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 14px 18px; border-bottom: 1px solid var(--line); }
.dv header .cn { font-family: var(--font-mono); font-size: 15px; color: var(--cyan); }
.dv header button { background: none; border: 1px solid var(--line); color: var(--dim);
  font-family: var(--font-mono); padding: 3px 10px; cursor: pointer; }
.dv header button:hover { color: var(--paper); }
.dv .body2 { padding: 16px 18px; overflow-y: auto; flex: 1; }
.dv dl { display: grid; grid-template-columns: 110px 1fr; gap: 7px 12px; margin: 0 0 14px;
  font-family: var(--font-mono); font-size: 12px; }
.dv dt { color: var(--dim); text-transform: uppercase; letter-spacing: 0.06em; font-size: 10.5px; padding-top: 1px; }
.dv dd { margin: 0; }
.dv .facts { font-size: 13px; line-height: 1.55; border-top: 1px solid var(--line); padding-top: 12px; }
.dv .facts h3, .dv .pp h3 { font-family: var(--font-display); font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.1em; font-size: 12px; color: var(--dim); margin: 0 0 8px; }
.dv .pp { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 12px; }
.dv .pp a { display: inline-block; font-family: var(--font-mono); font-size: 12px; text-decoration: none;
  color: var(--paper); border: 1px solid var(--line); padding: 4px 10px; margin: 0 6px 6px 0; }
.dv .pp a:hover { border-color: var(--brass); color: var(--brass); }
.dv .pp a .tc { color: var(--dim); }
.dv footer { padding: 14px 18px; border-top: 1px solid var(--line); display: flex; gap: 10px; }
.dv footer a, .dv footer button { flex: 1; text-align: center; font-family: var(--font-mono); font-size: 12px;
  padding: 9px 0; cursor: pointer; text-decoration: none; }
.dv footer .ask { background: var(--brass); color: var(--ink); border: 1px solid var(--brass); font-weight: 500; }
.dv footer .loc { background: none; color: var(--dim); border: 1px solid var(--line); }
.dv footer .loc:hover { color: var(--paper); border-color: var(--dim); }
.dv .gv-heinous { color: var(--red); }

.wif { display: grid; grid-template-columns: 300px 1fr; gap: 0; }
@media (max-width: 980px) { .wif { grid-template-columns: 1fr; } }
.wif .ctrl { padding: 16px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
.wif .ctrl label { font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.08em; font-size: 12px; color: var(--dim); display: block; margin-bottom: 4px; }
.wif .ctrl select { width: 100%; }
.wif .ctrl .hourrow { display: flex; align-items: center; gap: 10px; }
.wif .ctrl input[type=range] { flex: 1; accent-color: var(--brass); }
.wif .ctrl .hv { font-family: var(--font-mono); font-size: 12px; min-width: 44px; text-align: right; }
.wif .ctrl .flags { display: flex; gap: 8px; flex-wrap: wrap; }
.wif .out { padding: 16px 20px; }
.wif .big { font-family: var(--font-mono); font-size: 44px; font-weight: 500; }
.wif .big.hi { color: var(--red); } .wif .big.med { color: var(--brass); } .wif .big.lo { color: var(--cyan); }
.wif .sub { color: var(--dim); font-family: var(--font-mono); font-size: 11.5px; margin: 2px 0 16px; }
.wif .contrib { display: grid; grid-template-columns: 200px 1fr; gap: 6px 12px; font-family: var(--font-mono); font-size: 11.5px; align-items: center; }
.wif .contrib .nm { color: var(--dim); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wif .cbar { position: relative; height: 12px; }
.wif .cbar i { position: absolute; top: 1px; bottom: 1px; }
.wif .cbar .mid { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 2px; background: var(--dim); opacity: 0.6; }
.wif .axis { display: grid; grid-template-columns: 200px 1fr; gap: 6px 12px; font-family: var(--font-mono); font-size: 10.5px; color: var(--dim); margin-bottom: 8px; }
.wif .axis div:last-child { display: flex; justify-content: space-between; }
.wif .axis .lo2 { color: var(--cyan); } .wif .axis .hi2 { color: var(--red); }

.pat { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 1px; background: var(--line); }
.pat .card { background: var(--panel); padding: 14px 16px; }
.pat .card .st { font-weight: 600; }
.pat .card .st .d { color: var(--dim); font-weight: 400; font-size: 12px; }
.pat .card .prio { float: right; font-family: var(--font-mono); font-size: 10.5px; padding: 2px 8px; border: 1px solid var(--line); color: var(--dim); }
.pat .card .prio.crit { color: var(--red); border-color: var(--red); }
.pat .card .prio.elev { color: var(--brass); border-color: var(--brass); }
.pat .win { display: grid; grid-template-columns: 96px 1fr 44px; gap: 4px 10px; font-family: var(--font-mono); font-size: 11.5px; margin-top: 10px; align-items: center; }
.pat .win .wl { color: var(--dim); }
.pat .win .wl.top { color: var(--brass); }
.pat .win .wb { height: 8px; background: var(--panel-2); }
.pat .win .wb i { display: block; height: 100%; background: var(--dim); }
.pat .win .wb i.top { background: var(--brass); }
.pat .win .wr { text-align: right; color: var(--dim); }
@media print {
  body.print-patrol * { visibility: hidden; }
  body.print-patrol #patrol-panel, body.print-patrol #patrol-panel * { visibility: visible; }
  body.print-patrol #patrol-panel { position: absolute; left: 0; top: 0; width: 100%;
    background: #fff !important; color: #000 !important; border: 0; }
  body.print-patrol #patrol-panel .card, body.print-patrol #patrol-panel .pat { background: #fff !important; }
  body.print-patrol #patrol-panel h2, body.print-patrol #patrol-panel .st,
  body.print-patrol #patrol-panel .wl, body.print-patrol #patrol-panel .wr { color: #000 !important; }
  body.print-patrol #patrol-panel button { display: none; }
}

.loading, .error-banner { padding: 40px; text-align: center; color: var(--dim); font-family: var(--font-mono); }
.error-banner { color: var(--red); }
.maplibregl-popup-content { background: var(--panel-2); color: var(--paper); font-family: var(--font-mono); font-size: 12px; border: 1px solid var(--line); border-radius: 0; }
.maplibregl-popup-tip { border-top-color: var(--panel-2) !important; }
</style>
</head>
<body>
<div class="wrap">
  <nav class="platform">
    <a href="/app/index.html">Conversational Intelligence</a>
    <a href="/app/analytics.html" class="here" aria-current="page">Crime Analytics</a>
  </nav>
  <header class="top">
    <div class="wordmark">KSP <span class="sub">Crime Intelligence</span></div>
    <nav class="nav">
      <a href="/app/index.html">Agent Console</a>
      <a class="here" href="/app/analytics.html">Analytics</a>
    </nav>
    <div class="stamp" id="stamp">DATA HORIZON — LOADING</div>
  </header>

  <div class="controls">
    <label for="f-district">District</label>
    <select id="f-district"><option value="">All districts</option></select>
    <label for="f-head">Crime head</label>
    <select id="f-head"><option value="">All crime heads</option></select>
    <label for="f-station">Station</label>
    <select id="f-station"><option value="">All stations</option></select>
    <label for="f-from">From</label>
    <input type="date" id="f-from" />
    <label for="f-to">To</label>
    <input type="date" id="f-to" />
    <button class="toggle" id="f-heinous" aria-pressed="false">Heinous only</button>
    <button class="reset" id="f-reset">Clear filters</button>
  </div>

  <div id="app">
    <div class="loading">LOADING CRIME RECORDS…</div>
  </div>
</div>

<div class="dv-ov" id="dv-ov" hidden></div>
<aside class="dv" id="dv" role="dialog" aria-label="Case detail" hidden>
  <header>
    <span class="cn" id="dv-cn">&#8212;</span>
    <button id="dv-x" aria-label="Close">ESC</button>
  </header>
  <div class="body2">
    <dl id="dv-fields"></dl>
    <div class="facts" id="dv-facts"></div>
    <div class="pp" id="dv-pp"></div>
  </div>
  <footer>
    <button class="loc" id="dv-loc">Show on map</button>
    <a class="ask" id="dv-ask" href="#">Ask the agent</a>
  </footer>
</aside>

<script>
(function () {
  "use strict";
  const API = "/server/analytics";
  const state = { district: "", majorHead: "", station: "", from: "", to: "", heinous: false, spiked: new Map(), months: [], byMonth: new Map(), scrubIdx: null, fullHeat: null, lastBD: null, summary: null, map: null, mapMode: "stations", charts: {} };

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const fmt = (n) => Number(n).toLocaleString("en-IN");

  function qs(extra) {
    const p = new URLSearchParams();
    if (state.district) p.set("district", state.district);
    if (state.majorHead) p.set("majorHead", state.majorHead);
    if (state.station) p.set("station", state.station);
    if (state.from) p.set("from", state.from);
    if (state.to) p.set("to", state.to);
    if (state.heinous) p.set("gravity", "Heinous");
    for (const k in extra || {}) p.set(k, extra[k]);
    const s = p.toString();
    return s ? "?" + s : "";
  }

  async function get(path) {
    const r = await fetch(API + path);
    if (!r.ok) throw new Error(path + " → HTTP " + r.status);
    return r.json();
  }

  // ---------- layout ----------
  function renderShell() {
    $("app").innerHTML = `
      <div class="kpis" id="kpis"></div>
      <div class="grid">
        <div class="panel">
          <h2>District &amp; Station Map
            <span class="map-toggles">
              <button id="m-stations" class="on">Stations</button>
              <button id="m-heat">Heatmap</button>
              <button id="m-night">Night only</button>
            </span>
          </h2>
          <div id="map"></div>
          <div class="scrub">
            <button id="sc-play" aria-label="Play timeline">&#9654;</button>
            <input type="range" id="sc-range" min="0" max="0" value="0" aria-label="Month" />
            <span class="lbl" id="sc-label">All time</span>
            <button id="sc-all">All</button>
          </div>
          <div class="legend">
            <span><span class="sw" style="background:var(--brass)"></span>circle area = case volume</span>
            <span><span class="sw" style="background:var(--red)"></span>heat = incident density</span>
            <span><span class="sw" style="background:var(--red); border-radius:50%"></span>pulsing = active spike alert</span>
            <span>district shade = case volume · click a district or station to drill down</span>
          </div>
        </div>
        <div class="panel">
          <h2>Emerging Trend Alerts <span class="meta" id="spike-meta"></span></h2>
          <div class="spike-rail" id="spikes"></div>
        </div>
      </div>
      <div class="charts">
        <div class="panel">
          <h2>Monthly Case Volume <span class="meta" id="ts-meta"></span></h2>
          <div class="body chart-box"><canvas id="c-timeseries"></canvas></div>
        </div>
        <div class="panel">
          <h2>By Crime Head</h2>
          <div class="body chart-box"><canvas id="c-categories"></canvas></div>
        </div>
      </div>
      <div class="charts">
        <div class="panel">
          <h2>Predictive Risk <span class="meta" id="risk-meta"></span></h2>
          <div class="spike-rail" id="risk"></div>
        </div>
        <div class="panel">
          <h2>Anomalous Incidents <span class="meta">rarity-scored</span></h2>
          <div class="spike-rail" id="anomalies"></div>
        </div>
      </div>
      <div class="panel" style="margin-top:20px" id="patrol-panel">
        <h2>Patrol Deployment Recommendations
          <span class="meta">derived from hotspot rates · <button class="reset" id="pat-print" style="padding:2px 10px">Print duty chart</button></span></h2>
        <div class="pat" id="patrol"></div>
      </div>
      <div class="charts">
        <div class="panel">
          <h2>Repeat Offenders <span class="meta" id="off-meta"></span></h2>
          <div id="offenders"></div>
        </div>
        <div class="panel">
          <h2>Socio-Economic Overlay <span class="meta">Census 2011</span></h2>
          <div class="socio-corr" id="socio-corr"></div>
          <div class="matrix-wrap"><table class="socio" id="socio-table"></table></div>
          <div class="caveat" id="socio-caveat"></div>
        </div>
      </div>
      <div class="panel" style="margin-top:20px">
        <h2>Case Triage — Trained Risk Model <span class="meta" id="ml-meta"></span></h2>
        <div class="mlcard" id="ml-card"></div>
        <div id="triage"></div>
      </div>
      <div class="panel" style="margin-top:20px">
        <h2>What-If Risk Explorer <span class="meta">live from the trained model's coefficients</span></h2>
        <div class="wif">
          <div class="ctrl">
            <div><label for="wi-station">Station</label><select id="wi-station"></select></div>
            <div><label for="wi-head">Crime head</label><select id="wi-head"></select></div>
            <div><label for="wi-hour">Incident hour</label>
              <div class="hourrow"><input type="range" id="wi-hour" min="0" max="23" value="21" /><span class="hv" id="wi-hv">21:00</span></div></div>
            <div><label for="wi-q">Quarter</label><select id="wi-q"><option>Q1</option><option>Q2</option><option>Q3</option><option selected>Q4</option></select></div>
            <div class="flags">
              <button class="toggle" id="wi-heinous" aria-pressed="false">Heinous</button>
              <button class="toggle" id="wi-linked" aria-pressed="false">Linked repeat offender</button>
            </div>
          </div>
          <div class="out">
            <div class="big" id="wi-p">&#8212;</div>
            <div class="sub">predicted probability the case goes undetected · every factor shown below</div>
            <div class="axis"><div></div><div><span class="lo2">&#9668; lowers risk</span><span class="hi2">raises risk &#9658;</span></div></div>
            <div class="contrib" id="wi-c"></div>
          </div>
        </div>
      </div>
      <div class="panel" style="margin-top:20px">
        <h2>Spatiotemporal Hotspots <span class="meta">station × time of day, z-score of incidents/hour</span></h2>
        <div class="matrix-wrap" id="matrix"></div>
        <div class="legend">
          <span><span class="sw" style="box-shadow: inset 0 0 0 2px var(--brass)"></span>z ≥ 1.5 elevated</span>
          <span><span class="sw" style="box-shadow: inset 0 0 0 2px var(--red)"></span>z ≥ 2.0 hotspot</span>
          <span>cell shade = incident rate vs statewide mean</span>
        </div>
      </div>`;
    $("m-stations").onclick = () => setMapMode("stations");
    $("m-heat").onclick = () => setMapMode("heat");
    $("m-night").onclick = () => setMapMode("night");
  }

  // ---------- KPIs ----------
  function renderKpis(summary, spikes) {
    const flagged = spikes.spikes.length;
    $("kpis").innerHTML = `
      <div class="kpi"><div class="n">${fmt(summary.totalCases)}</div><div class="l">Cases on record</div></div>
      <div class="kpi"><div class="n">${summary.districts.length}</div><div class="l">Districts</div></div>
      <div class="kpi"><div class="n" id="kpi-stations">—</div><div class="l">Police stations</div></div>
      <div class="kpi ${flagged ? "alert" : ""}"><div class="n">${flagged}</div><div class="l">Active spike alerts</div></div>`;
  }

  // ---------- map ----------
  const PU_TO_CENSUS = { "Bengaluru City": "Bengaluru Urban", "Bengaluru Rural": "Bengaluru Rural",
    "Mysuru": "Mysuru", "Mangaluru City": "Dakshina Kannada", "Belagavi": "Belagavi",
    "Hubballi-Dharwad": "Dharwad", "Kalaburagi": "Kalaburagi", "Shivamogga": "Shivamogga" };
  const CENSUS_TO_PU = Object.fromEntries(Object.entries(PU_TO_CENSUS).map(([a, b]) => [b, a]));

  function updateChoropleth(districts) {
    const map = state.map;
    if (!map || !map.getLayer("lyr-district-fill")) return;
    const max = Math.max(...districts.map((d) => d.count), 1);
    const expr = ["match", ["get", "district"]];
    for (const d of districts) {
      const census = PU_TO_CENSUS[d.district];
      if (!census) continue;
      const t = d.count / max;
      expr.push(census, "rgba(232,163,61," + (0.12 + t * 0.6).toFixed(2) + ")");
    }
    expr.push("rgba(21,29,44,0.35)"); // districts with no demo data
    map.setPaintProperty("lyr-district-fill", "fill-color", expr);
    map.setFilter("lyr-district-sel",
      ["==", ["get", "district"], PU_TO_CENSUS[state.district] || ""]);
  }

  // ---------- time scrubber ----------
  let scrubTimer = null;

  function buildMonthIndex(points) {
    const byMonth = new Map();
    points = (points || []).filter((p) => typeof p[2] === "string" && /^\d{4}-\d{2}$/.test(p[2]));
    for (const p of points) {
      let b = byMonth.get(p[2]);
      if (!b) { b = { feats: [], dist: new Map() }; byMonth.set(p[2], b); }
      b.feats.push({ type: "Feature", geometry: { type: "Point", coordinates: [p[1], p[0]] }, properties: {} });
      b.dist.set(p[3], (b.dist.get(p[3]) || 0) + 1);
    }
    state.months = [...byMonth.keys()].sort();
    state.byMonth = byMonth;
    const r = $("sc-range");
    const ok = state.months.length > 1;
    r.max = Math.max(0, state.months.length - 1);
    r.disabled = !ok;
    $("sc-play").disabled = !ok;
    $("sc-all").disabled = !ok;
    if (!ok) { $("sc-label").textContent = "\u2014"; return; }
    if (state.scrubIdx == null) { r.value = 0; $("sc-label").textContent = "All time"; }
  }

  function applyScrub(idx) {
    state.scrubIdx = idx;
    const map = state.map;
    if (idx == null) {
      $("sc-label").textContent = "All time";
      if (map.getSource("src-heat") && state.fullHeat) map.getSource("src-heat").setData(state.fullHeat);
      if (state.lastBD) updateChoropleth(state.lastBD);
      return;
    }
    const mk = state.months[idx];
    $("sc-label").textContent = mk;
    $("sc-range").value = idx;
    const b = state.byMonth.get(mk) || { feats: [], dist: new Map() };
    if (map.getSource("src-heat"))
      map.getSource("src-heat").setData({ type: "FeatureCollection", features: b.feats });
    setMapMode("heat");
    const dl = [...b.dist.entries()].map(([district, count]) => ({ district, count }));
    updateChoropleth(dl);
  }

  function stopScrubPlay() {
    if (scrubTimer) { clearInterval(scrubTimer); scrubTimer = null; }
    $("sc-play").classList.remove("playing");
    $("sc-play").innerHTML = "&#9654;";
  }

  function wireScrubber() {
    $("sc-range").oninput = (e) => { stopScrubPlay(); applyScrub(+e.target.value); };
    $("sc-all").onclick = () => { stopScrubPlay(); applyScrub(null); };
    $("sc-play").onclick = () => {
      if (scrubTimer) { stopScrubPlay(); return; }
      $("sc-play").classList.add("playing");
      $("sc-play").innerHTML = "&#10074;&#10074;";
      let i = state.scrubIdx != null && state.scrubIdx < state.months.length - 1 ? state.scrubIdx : -1;
      scrubTimer = setInterval(() => {
        i += 1;
        if (i >= state.months.length) { stopScrubPlay(); applyScrub(null); return; }
        applyScrub(i);
      }, 450);
    };
  }

  function initMap() {
    state.map = new maplibregl.Map({
      container: "map",
      style: "https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json",
      center: [76.5, 14.6],
      zoom: 6,
      attributionControl: true
    });
    state.map.addControl(new maplibregl.NavigationControl({ showCompass: false }));
    return new Promise((res) => state.map.on("load", async () => {
      try {
        const r = await fetch("/app/karnataka-districts.geojson");
        if (r.ok) state.geo = await r.json();
      } catch (e) { state.geo = null; }
      const map = state.map;
      if (state.geo) {
        map.addSource("src-districts", { type: "geojson", data: state.geo });
        map.addLayer({ id: "lyr-district-fill", type: "fill", source: "src-districts",
          paint: { "fill-color": "rgba(21,29,44,0.35)" } });
        map.addLayer({ id: "lyr-district-line", type: "line", source: "src-districts",
          paint: { "line-color": "#26314a", "line-width": 1 } });
        map.addLayer({ id: "lyr-district-sel", type: "line", source: "src-districts",
          filter: ["==", ["get", "district"], ""],
          paint: { "line-color": "#e8a33d", "line-width": 2.5 } });
        map.on("click", "lyr-district-fill", (e) => {
          if (e.originalEvent._handled) return;
          const census = e.features[0].properties.district;
          const pu = CENSUS_TO_PU[census];
          if (!pu) {
            new maplibregl.Popup().setLngLat(e.lngLat)
              .setHTML(`<b>${esc(census)}</b><br>no records in demo dataset`).addTo(map);
            return;
          }
          state.district = state.district === pu ? "" : pu;
          state.station = "";
          $("f-district").value = state.district;
          refresh();
        });
        map.on("mouseenter", "lyr-district-fill", () => (map.getCanvas().style.cursor = "pointer"));
        map.on("mouseleave", "lyr-district-fill", () => (map.getCanvas().style.cursor = ""));
      }
      res();
    }));
  }

  function stationsToGeoJSON(stations) {
    return {
      type: "FeatureCollection",
      features: stations.filter((s) => s.centroid).map((s) => ({
        type: "Feature",
        geometry: { type: "Point", coordinates: [s.centroid.lng, s.centroid.lat] },
        properties: { station: s.station, district: s.district, count: s.count,
          top: (s.topMajorHeads[0] || {}).majorHead || "—" }
      }))
    };
  }

  function heatToGeoJSON(points) {
    return {
      type: "FeatureCollection",
      features: points.map((p) => ({
        type: "Feature",
        geometry: { type: "Point", coordinates: [p[1], p[0]] }, // API sends [lat,lng]
        properties: {}
      }))
    };
  }

  async function refreshMap() {
    const [st, heat, night, monthly] = await Promise.all([
      get("/by-station" + qs()),
      get("/heatmap" + qs()),
      get("/heatmap" + qs({ hourFrom: 22, hourTo: 5 })),
      get("/heatmap" + qs({ monthly: 1 }))
    ]);
    buildMonthIndex(monthly.points);
    $("kpi-stations") && ($("kpi-stations").textContent = st.stations.length);
    const sel = $("f-station");
    if (sel) {
      const names = st.stations.map((x) => x.station).sort();
      const keep = state.station && names.includes(state.station) ? state.station : "";
      sel.innerHTML = '<option value="">All stations</option>' +
        names.map((n) => `<option${n === keep ? " selected" : ""}>${esc(n)}</option>`).join("");
      if (!keep && state.station) { state.station = ""; }
    }

    const map = state.map;
    const sets = {
      stations: stationsToGeoJSON(st.stations),
      heat: heatToGeoJSON(heat.points),
      night: heatToGeoJSON(night.points)
    };
    state.fullHeat = sets.heat;
    for (const id of ["stations", "heat", "night"]) {
      if (map.getSource("src-" + id)) map.getSource("src-" + id).setData(sets[id]);
      else map.addSource("src-" + id, { type: "geojson", data: sets[id] });
    }
    if (!map.getLayer("lyr-stations")) {
      map.addLayer({
        id: "lyr-stations", type: "circle", source: "src-stations",
        paint: {
          "circle-radius": ["*", 0.9, ["sqrt", ["get", "count"]]],
          "circle-color": "#e8a33d", "circle-opacity": 0.55,
          "circle-stroke-color": "#e8a33d", "circle-stroke-width": 1.5
        }
      });
      for (const hid of ["heat", "night"]) {
        map.addLayer({
          id: "lyr-" + hid, type: "heatmap", source: "src-" + hid,
          layout: { visibility: "none" },
          paint: {
            "heatmap-radius": 22, "heatmap-intensity": 0.9,
            "heatmap-color": ["interpolate", ["linear"], ["heatmap-density"],
              0, "rgba(0,0,0,0)", 0.3, "#3b4b6b", 0.6, "#e8a33d", 1, "#e4573d"]
          }
        });
      }
      map.on("click", "lyr-stations", (e) => {
        e.originalEvent._handled = true;
        const p = e.features[0].properties;
        new maplibregl.Popup().setLngLat(e.lngLat)
          .setHTML(`<b>${esc(p.station)}</b><br>${esc(p.district)}<br>${fmt(p.count)} cases · top: ${esc(p.top)}`)
          .addTo(map);
      });
      map.on("mouseenter", "lyr-stations", () => (map.getCanvas().style.cursor = "pointer"));
      map.on("mouseleave", "lyr-stations", () => (map.getCanvas().style.cursor = ""));
    }
    // red-zone pulse for districts with active spike alerts
    const dAgg = new Map();
    for (const stn of st.stations) {
      if (!stn.centroid) continue;
      let a = dAgg.get(stn.district);
      if (!a) { a = { latSum: 0, lngSum: 0, n: 0 }; dAgg.set(stn.district, a); }
      a.latSum += stn.centroid.lat; a.lngSum += stn.centroid.lng; a.n += 1;
    }
    const pulseGeo = {
      type: "FeatureCollection",
      features: [...state.spiked.entries()]
        .filter(([d]) => dAgg.has(d))
        .map(([d, heads]) => {
          const a = dAgg.get(d);
          return { type: "Feature",
            geometry: { type: "Point", coordinates: [a.lngSum / a.n, a.latSum / a.n] },
            properties: { district: d, heads: heads.join("<br>") } };
        })
    };
    if (map.getSource("src-pulse")) map.getSource("src-pulse").setData(pulseGeo);
    else {
      map.addSource("src-pulse", { type: "geojson", data: pulseGeo });
      map.addLayer({ id: "lyr-pulse-halo", type: "circle", source: "src-pulse",
        paint: { "circle-radius": 22, "circle-color": "#e4573d", "circle-opacity": 0.25,
                 "circle-stroke-color": "#e4573d", "circle-stroke-width": 1, "circle-stroke-opacity": 0.5 } });
      map.addLayer({ id: "lyr-pulse-core", type: "circle", source: "src-pulse",
        paint: { "circle-radius": ["interpolate", ["exponential", 1.6], ["zoom"], 4, 2.5, 6.5, 6, 10, 12],
                 "circle-color": "#e4573d" } });
      map.on("click", "lyr-pulse-core", (e) => {
        const p = e.features[0].properties;
        new maplibregl.Popup().setLngLat(e.lngLat)
          .setHTML(`<b>SPIKE \u00b7 ${esc(p.district)}</b><br>${p.heads}`).addTo(map);
      });
      map.on("mouseenter", "lyr-pulse-core", () => (map.getCanvas().style.cursor = "pointer"));
      map.on("mouseleave", "lyr-pulse-core", () => (map.getCanvas().style.cursor = ""));
      startPulse();
    }
    setMapMode(state.mapMode);
    if (state.scrubIdx != null) applyScrub(Math.min(state.scrubIdx, state.months.length - 1));
  }

  let pulseRAF = null;
  function startPulse() {
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    if (pulseRAF) cancelAnimationFrame(pulseRAF);
    const loop = (t) => {
      const map = state.map;
      if (map && map.getLayer("lyr-pulse-halo")) {
        const k = (Math.sin(t / 450) + 1) / 2;
        const r = 14 + k * 26;
        map.setPaintProperty("lyr-pulse-halo", "circle-radius",
          ["interpolate", ["exponential", 1.6], ["zoom"], 4, r * 0.4, 6.5, r, 10, r * 2]);
        map.setPaintProperty("lyr-pulse-halo", "circle-opacity", 0.38 * (1 - k) + 0.05);
      }
      pulseRAF = requestAnimationFrame(loop);
    };
    pulseRAF = requestAnimationFrame(loop);
  }

  function setMapMode(mode) {
    state.mapMode = mode;
    const vis = { stations: mode === "stations", heat: mode === "heat", night: mode === "night" };
    for (const id in vis) {
      if (state.map.getLayer("lyr-" + id))
        state.map.setLayoutProperty("lyr-" + id, "visibility", vis[id] ? "visible" : "none");
      const btn = $("m-" + (id === "night" ? "night" : id === "heat" ? "heat" : "stations"));
      btn.classList.toggle("on", vis[id]);
    }
  }

  // ---------- spikes ----------
  function renderSpikes(sp) {
    $("spike-meta").textContent = "90d window · as of " + sp.anchor;
    const rail = $("spikes");
    const hot = sp.spikes;
    const rows = hot.length ? hot : (sp.all || []).slice(0, 6);
    if (!rows.length) { rail.innerHTML = '<div class="empty">No trend data for this filter.</div>'; return; }
    rail.innerHTML =
      (hot.length ? "" : '<div class="empty">No spikes above 2σ. Watchlist — highest deviations:</div>') +
      rows.map((s) => `
        <div class="spike ${hot.length ? "hot" : "watch"}">
          <span class="dot"></span>
          <div>
            <div class="where">${esc(s.district)}</div>
            <div class="what">${esc(s.majorHead)}</div>
          </div>
          <div class="nums">
            <div class="z">z ${s.zScore.toFixed(1)}</div>
            <div>${s.currentWindow} vs μ${s.baselineMean}</div>
            ${s.pctChange != null ? `<div>${s.pctChange > 0 ? "+" : ""}${s.pctChange}%</div>` : ""}
          </div>
        </div>`).join("");
  }

  // ---------- charts ----------
  const chartDefaults = {
    color: "#8a97ad",
    borderColor: "#26314a",
    font: { family: "'IBM Plex Mono', monospace", size: 11 }
  };
  Chart.defaults.color = chartDefaults.color;
  Chart.defaults.borderColor = chartDefaults.borderColor;
  Chart.defaults.font = chartDefaults.font;

  function renderTimeseries(ts) {
    $("ts-meta").textContent = state.district || "statewide";
    const ctx = $("c-timeseries");
    if (state.charts.ts) state.charts.ts.destroy();
    state.charts.ts = new Chart(ctx, {
      type: "line",
      data: {
        labels: ts.series.map((p) => p.period),
        datasets: [{ data: ts.series.map((p) => p.count), borderColor: "#5fb4c9",
          backgroundColor: "rgba(95,180,201,0.12)", fill: true, pointRadius: 0, borderWidth: 1.5, tension: 0.25 }]
      },
      options: { responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { x: { ticks: { maxTicksLimit: 12 }, grid: { display: false } }, y: { beginAtZero: true } } }
    });
  }

  function renderCategories(byDistrict) {
    const counts = new Map();
    for (const d of byDistrict.districts)
      for (const c of d.topMajorHeads) counts.set(c.majorHead, (counts.get(c.majorHead) || 0) + c.count);
    const rows = [...counts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 8);
    const ctx = $("c-categories");
    if (state.charts.cat) state.charts.cat.destroy();
    state.charts.cat = new Chart(ctx, {
      type: "bar",
      data: { labels: rows.map((r) => r[0]),
        datasets: [{ data: rows.map((r) => r[1]), backgroundColor: "#e8a33d", borderWidth: 0, barThickness: 14 }] },
      options: { indexAxis: "y", responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { x: { beginAtZero: true }, y: { grid: { display: false } } } }
    });
  }

  // ---------- hotspot matrix ----------
  const BUCKETS = ["night", "morning", "afternoon", "evening"];
  function renderMatrix(hs) {
    const byStation = new Map();
    let maxRate = 0;
    for (const c of hs.cells) {
      if (!byStation.has(c.station)) byStation.set(c.station, { district: c.district, cells: {} });
      byStation.get(c.station).cells[c.bucket] = c;
      maxRate = Math.max(maxRate, c.count);
    }
    const stations = [...byStation.entries()].sort((a, b) => {
      const za = Math.max(...Object.values(a[1].cells).map((c) => c.zScore));
      const zb = Math.max(...Object.values(b[1].cells).map((c) => c.zScore));
      return zb - za;
    });
    $("matrix").innerHTML = `
      <table class="matrix">
        <thead><tr><th>Station</th>${BUCKETS.map((b) => `<th class="b">${b}</th>`).join("")}</tr></thead>
        <tbody>
          ${stations.map(([name, s]) => `
            <tr>
              <td class="station">${esc(name)}<br><span class="d">${esc(s.district)}</span></td>
              ${BUCKETS.map((b) => {
                const c = s.cells[b];
                if (!c) return '<td><span class="cell">·</span></td>';
                const alpha = Math.min(0.85, 0.08 + (c.count / maxRate) * 0.7);
                const cls = c.zScore >= 2 ? "cell flag2" : c.zScore >= 1.5 ? "cell flag" : "cell";
                return `<td><span class="${cls}" style="background:rgba(232,163,61,${alpha.toFixed(2)})"
                  title="z ${c.zScore}">${c.count}</span></td>`;
              }).join("")}
            </tr>`).join("")}
        </tbody>
      </table>`;
  }

  // ---------- risk ----------
  function renderRisk(rk) {
    $("risk-meta").textContent = "3-month forecast \u00b7 as of " + rk.anchor;
    const rows = rk.stations.slice(0, 8);
    if (!rows.length) { $("risk").innerHTML = '<div class="empty">No stations match this filter.</div>'; return; }
    $("risk").innerHTML = rows.map((s) => {
      const cls = s.riskScore >= 70 ? "hi" : s.riskScore >= 45 ? "med" : "lo";
      const drv = [];
      if (s.drivers.volume >= 0.6) drv.push("high volume");
      if (s.drivers.trend >= 0.6) drv.push("rising trend");
      if (s.drivers.heinous >= 0.6) drv.push("heinous share");
      return `
      <div class="risk-row">
        <div class="risk-score ${cls}">${s.riskScore}</div>
        <div class="who"><div>${esc(s.station)}</div>
          <div class="d">${esc(s.district)}${drv.length ? " \u00b7 " + drv.join(", ") : ""}</div></div>
        <div class="fc">next 3 mo<br><b>${s.forecastNext3Months.join(" \u00b7 ")}</b></div>
      </div>`;
    }).join("");
  }

  // ---------- anomalies ----------
  function renderAnomalies(an) {
    const rows = an.anomalies;
    if (!rows.length) { $("anomalies").innerHTML = '<div class="empty">No incidents deviate from learned patterns under this filter.</div>'; return; }
    $("anomalies").innerHTML = rows.slice(0, 8).map((a) => `
      <div class="anom">
        <div class="head"><a class="no" href="/app/index.html?ask=${encodeURIComponent("Give me full details of case " + a.crimeNo + " and why it might be unusual")}">${esc(a.crimeNo)}</a><span class="sc">score ${a.score}</span></div>
        <div class="what">${esc(a.majorHead)} \u00b7 ${esc(a.station)} \u00b7 ${esc(a.incidentAt)}</div>
        <div class="why">${a.reasons.map((r) => `<span>${esc(r)}</span>`).join("")}</div>
      </div>`).join("");
  }

  // ---------- socio ----------
// ---------- repeat offenders ----------
  function renderOffenders(off) {
    $("off-meta").textContent = fmt(off.totalRepeatOffenders) + " repeat \u00b7 " + fmt(off.crossJurisdictionCount) + " cross-jurisdiction";
    const rows = off.offenders.slice(0, 8);
    if (!rows.length) { $("offenders").innerHTML = '<div class="empty">No linked repeat offenders found.</div>'; return; }
    $("offenders").innerHTML = rows.map((o) => `
      <details class="off">
        <summary>
          <span class="who">${esc(o.name)} <span class="pid">${esc(o.personId)}</span></span>
          <span class="stats"><b>${o.caseCount}</b> cases \u00b7 <b>${o.districts.length}</b> district${o.districts.length > 1 ? "s" : ""}</span>
          <span class="tags">
            ${o.crossJurisdiction ? '<span class="tag xj">cross-jurisdiction</span>' : ""}
            ${o.moBreakdown.slice(0, 3).map((m) => `<span class="tag mo">${esc(m.majorHead)} \u00d7${m.count}</span>`).join("")}
          </span>
        </summary>
        <div class="timeline">
          ${o.timeline.slice(0, 6).map((t) => `
            <div class="tl-row">
              <span>${esc(t.date)}</span>
              <span><a class="no" href="/app/index.html?q=${encodeURIComponent("Tell me about case " + t.crimeNo)}">${esc(t.crimeNo)}</a> \u00b7 ${esc(t.station)} \u00b7 ${esc(t.majorHead)}</span>
              <span class="st">${esc(t.status)}</span>
            </div>`).join("")}
        </div>
      </details>`).join("");
  }

  // ---------- socio overlay ----------
  function corrColor(r) { return r == null ? "var(--dim)" : Math.abs(r) >= 0.5 ? "var(--brass)" : "var(--dim)"; }
  function renderSocio(so) {
    const c = so.correlations;
    $("socio-corr").innerHTML = [
      ["urbanizationVsCrimeRate", "Urbanization"],
      ["densityVsCrimeRate", "Density"],
      ["literacyVsCrimeRate", "Literacy"]
    ].map(([k, l]) => `<div class="c"><div class="v" style="color:${corrColor(c[k])}">${c[k] == null ? "\u2014" : "r " + c[k].toFixed(2)}</div><div class="l">${l} vs rate</div></div>`).join("");
    const maxRate = Math.max(...so.units.map((u) => u.casesPerLakh), 1);
    $("socio-table").innerHTML = `
      <thead><tr><th>Unit</th><th class="num">Cases / lakh</th><th class="num">Urban %</th><th class="num">Literacy %</th></tr></thead>
      <tbody>${so.units.slice().sort((a, b) => b.casesPerLakh - a.casesPerLakh).map((u) => `
        <tr><td>${esc(u.policeUnit)}</td>
        <td class="num"><span class="ratebar" style="width:${Math.round((u.casesPerLakh / maxRate) * 60)}px"></span>${u.casesPerLakh}</td>
        <td class="num">${u.urbanPct}</td><td class="num">${u.literacyPct}</td></tr>`).join("")}
      </tbody>`;
    $("socio-caveat").textContent = so.caveat;
  }

  // ---------- ML triage ----------
  function renderML(card, tr) {
    $("ml-meta").textContent = "predicts P(case goes undetected) \u00b7 trained in-function";
    const m = card.metrics;
    $("ml-card").innerHTML =
      `<span>algorithm <b>logistic regression</b></span>` +
      `<span>trained on <b>${fmt(card.trainedOn.resolvedCases)}</b> resolved cases</span>` +
      `<span>holdout AUC <b>${m.auc ?? "\u2014"}</b></span>` +
      `<span>accuracy <b>${m.accuracy ?? "\u2014"}</b></span>` +
      `<span>features <b>${card.features}</b> incl. graph + target-encoded</span>`;
    const rows = tr.triage;
    if (!rows.length) { $("triage").innerHTML = '<div class="empty">No open cases match this filter.</div>'; return; }
    const maxP = Math.max(...rows.map((t) => t.probability), 0.01);
    $("triage").innerHTML = rows.slice(0, 8).map((t) => `
      <div class="tri">
        <div class="p ${t.probability < 0.5 ? "med" : ""}">${(t.probability * 100).toFixed(0)}%</div>
        <div class="info"><a class="no" href="/app/index.html?q=${encodeURIComponent("Tell me about case " + t.crimeNo)}">${esc(t.crimeNo)}</a>
          \u00b7 ${esc(t.majorHead)} <span class="meta2">\u00b7 ${esc(t.station)} \u00b7 ${esc(t.incidentAt)} \u00b7 ${esc(t.gravity)}</span></div>
        <div class="bar"><i style="width:${Math.round((t.probability / maxP) * 100)}%"></i></div>
        <div class="drv">${t.drivers.map((d) => `<span class="${d.effect === "raises risk" ? "up" : ""}">${esc(d.feature)}</span>`).join("")}</div>
      </div>`).join("");
  }

  // ---------- filters ----------
  function populateFilters(summary) {
    $("f-district").innerHTML = '<option value="">All districts</option>' +
      summary.districts.map((d) => `<option>${esc(d.district)}</option>`).join("");
    $("f-head").innerHTML = '<option value="">All crime heads</option>' +
      summary.majorHeads.map((c) => `<option>${esc(c.majorHead)}</option>`).join("");
    $("f-district").onchange = (e) => { state.district = e.target.value; state.station = ""; refresh(); };
    $("f-head").onchange = (e) => { state.majorHead = e.target.value; refresh(); };
    $("f-station").onchange = (e) => { state.station = e.target.value; refresh(); };
    $("f-from").onchange = (e) => { state.from = e.target.value; refresh(); };
    $("f-to").onchange = (e) => { state.to = e.target.value; refresh(); };
    $("f-heinous").onclick = () => {
      state.heinous = !state.heinous;
      $("f-heinous").classList.toggle("on", state.heinous);
      $("f-heinous").setAttribute("aria-pressed", String(state.heinous));
      refresh();
    };
    $("f-reset").onclick = () => {
      state.district = state.majorHead = state.station = state.from = state.to = "";
      $("f-station").value = ""; $("f-from").value = ""; $("f-to").value = "";
      state.heinous = false;
      $("f-heinous").classList.remove("on");
      $("f-heinous").setAttribute("aria-pressed", "false");
      $("f-district").value = $("f-head").value = "";
      refresh();
    };
  }

  async function refresh() {
    const [ts, bd, hs, sp, rk, an, so, off, mlCard, mlTriage, mlExp] = await Promise.all([
      get("/timeseries" + qs({ granularity: "month" })),
      get("/by-district" + qs()),
      get("/hotspots" + qs()),
      get("/spikes"),
      get("/risk" + qs()),
      get("/anomalies" + qs({ limit: 8 })),
      get("/socio" + (() => { const p = new URLSearchParams();
        if (state.majorHead) p.set("majorHead", state.majorHead);
        if (state.heinous) p.set("gravity", "Heinous");
        const t = p.toString(); return t ? "?" + t : ""; })()),
      get("/offenders?limit=25"),
      get("/ml"),
      get("/ml/triage" + qs({ limit: 8 })),
      get("/ml/model")
    ]);
    renderTimeseries(ts);
    renderCategories(bd);
    state.lastBD = bd.districts;
    updateChoropleth(bd.districts);
    renderMatrix(hs);
    renderPatrol(hs);
    renderSpikes(sp);
    renderRisk(rk);
    renderAnomalies(an);
    renderOffenders(off);
    renderML(mlCard, mlTriage);
    wiInit(mlExp);
    renderSocio(so);
    await refreshMap();
  }

  function renderStamp(sm, liveText) {
    $("stamp").innerHTML = `DATA HORIZON <b>${sm.horizon.from}</b> \u2014 <b>${sm.horizon.to}</b> \u00b7 ${fmt(sm.totalCases)} RECORDS \u00b7 <span style="color:var(--cyan)">${liveText}</span>`;
  }

  // ---------- patrol deployment ----------
  const BUCKET_WINDOWS = { night: "22:00\u201306:00", morning: "06:00\u201312:00", afternoon: "12:00\u201318:00", evening: "18:00\u201322:00" };
  const BUCKET_HOURS = { night: 8, morning: 6, afternoon: 6, evening: 4 };
  function renderPatrol(hs) {
    const byStation = new Map();
    for (const c of hs.cells) {
      if (!byStation.has(c.station)) byStation.set(c.station, { district: c.district, cells: {} });
      byStation.get(c.station).cells[c.bucket] = c;
    }
    const cards = [...byStation.entries()].map(([station, s2]) => {
      const wins = Object.keys(BUCKET_WINDOWS).map((b) => {
        const c = s2.cells[b];
        return { bucket: b, rate: c ? c.count / BUCKET_HOURS[b] : 0, z: c ? c.zScore : 0, count: c ? c.count : 0 };
      }).sort((a, b) => b.rate - a.rate);
      return { station, district: s2.district, wins, topZ: wins[0].z, topRate: wins[0].rate };
    }).sort((a, b) => b.topRate - a.topRate);
    const maxRate = Math.max(...cards.map((c) => c.topRate), 0.01);
    $("patrol").innerHTML = cards.map((c) => {
      const prio = c.topZ >= 2 ? '<span class="prio crit">critical</span>'
        : c.topZ >= 1.5 ? '<span class="prio elev">elevated</span>' : "";
      return `<div class="card">
        ${prio}<div class="st">${esc(c.station)} <span class="d">${esc(c.district)}</span></div>
        <div class="win">${c.wins.map((w, i) => `
          <span class="wl ${i === 0 ? "top" : ""}">${w.bucket} ${BUCKET_WINDOWS[w.bucket]}</span>
          <span class="wb"><i class="${i === 0 ? "top" : ""}" style="width:${Math.round((w.rate / maxRate) * 100)}%"></i></span>
          <span class="wr">${w.rate.toFixed(1)}/h</span>`).join("")}
        </div></div>`;
    }).join("");
  }

  // ---------- what-if risk explorer ----------
  let wiModel = null;
  function wiInit(m) {
    wiModel = m;
    const st = $("wi-station"), hd = $("wi-head");
    const keepS = st.value, keepH = hd.value;
    st.innerHTML = Object.keys(m.stationRates).sort().map((n) => `<option${n === keepS ? " selected" : ""}>${esc(n)}</option>`).join("");
    hd.innerHTML = m.heads.map((n) => `<option${n === keepH ? " selected" : ""}>${esc(n)}</option>`).join("");
    wiCompute();
  }
  function wiCompute() {
    if (!wiModel) return;
    const m = wiModel;
    const station = $("wi-station").value, head = $("wi-head").value;
    const hour = +$("wi-hour").value;
    const quarter = $("wi-q").value;
    const heinous = $("wi-heinous").classList.contains("on");
    const linked = $("wi-linked").classList.contains("on");
    const district = m.stationDistrict[station];

    const x = m.featNames.map((f, j) => {
      if (j === 0) return 1;
      if (f === "station undetected history") {
        const st = m.stand.find((z) => z.idx === 1);
        return ((m.stationRates[station] ?? 0.5) - st.mean) / st.sd;
      }
      if (f === "crime-head undetected history") {
        const st = m.stand.find((z) => z.idx === 2);
        return ((m.headRates[head] ?? 0.5) - st.mean) / st.sd;
      }
      if (f === "night incident") return hour >= 22 || hour <= 5 ? 1 : 0;
      if (f === "heinous gravity") return heinous ? 1 : 0;
      if (f === "linked repeat offender") return linked ? 1 : 0;
      if (f.startsWith("district: ")) return f.slice(10) === district ? 1 : 0;
      if (f.startsWith("head: ")) return f.slice(6) === head ? 1 : 0;
      if (f.startsWith("quarter ")) return f.slice(8) === quarter ? 1 : 0;
      return 0;
    });
    const z = x.reduce((a, v, j) => a + v * m.weights[j], 0);
    const p = 1 / (1 + Math.exp(-z));
    const el = $("wi-p");
    el.textContent = (p * 100).toFixed(1) + "%";
    el.className = "big " + (p >= 0.5 ? "hi" : p >= 0.3 ? "med" : "lo");

    const contribs = x.map((v, j) => ({ f: m.featNames[j], c: v * m.weights[j] }))
      .filter((c) => c.f !== "bias" && Math.abs(c.c) > 0.001)
      .sort((a, b) => Math.abs(b.c) - Math.abs(a.c)).slice(0, 8);
    const maxC = Math.max(...contribs.map((c) => Math.abs(c.c)), 0.01);
    $("wi-c").innerHTML = contribs.map((c) => {
      const w = Math.abs(c.c) / maxC * 48;
      const pos = c.c > 0;
      return `<div class="nm">${esc(c.f)}</div>
        <div class="cbar"><span class="mid"></span>
          <i style="${pos ? "left:50%" : "right:50%"};width:${w}%;background:${pos ? "var(--red)" : "var(--cyan)"}"></i></div>`;
    }).join("");
  }
  function wiWire() {
    ["wi-station", "wi-head", "wi-q"].forEach((id) => { $(id).onchange = wiCompute; });
    $("wi-hour").oninput = (e) => { $("wi-hv").textContent = String(e.target.value).padStart(2, "0") + ":00"; wiCompute(); };
    ["wi-heinous", "wi-linked"].forEach((id) => {
      $(id).onclick = () => { $(id).classList.toggle("on"); $(id).setAttribute("aria-pressed", $(id).classList.contains("on")); wiCompute(); };
    });
  }

  // ---------- case drawer ----------
  let dvCase = null;
  function closeDrawer() {
    $("dv").classList.remove("open");
    setTimeout(() => { $("dv").hidden = true; }, 230);
    $("dv-ov").hidden = true;
  }
  async function openCase(crimeNo) {
    let c;
    try {
      const r = await fetch(API + "/case?crimeNo=" + encodeURIComponent(crimeNo));
      if (!r.ok) throw new Error();
      c = await r.json();
    } catch (e) {
      window.location.href = "/app/index.html?q=" + encodeURIComponent("Tell me about case " + crimeNo);
      return;
    }
    dvCase = c;
    $("dv-cn").textContent = c.crimeNo;
    const rows = [
      ["Status", c.status], ["Gravity", c.gravity],
      ["Crime head", c.majorHead], ["Minor head", c.minorHead],
      ["Station", c.station], ["District", c.district],
      ["Incident", c.incidentAt], ["Registered", c.registeredDate],
      ["Court", c.court], ["Final report", c.finalReport]
    ].filter(([, v]) => v);
    $("dv-fields").innerHTML = rows.map(([k, v]) =>
      `<dt>${k}</dt><dd class="${k === "Gravity" && v === "Heinous" ? "gv-heinous" : ""}">${esc(v)}</dd>`).join("");
    $("dv-facts").innerHTML = c.briefFacts
      ? `<h3>Brief facts</h3>${esc(c.briefFacts)}` : "";
    $("dv-pp").innerHTML = c.persons.length
      ? `<h3>Linked persons</h3>` + c.persons.map((p) =>
          `<a href="/app/index.html?q=${encodeURIComponent("Show me the criminal history of " + p.name)}">${esc(p.name)} <span class="tc">×${p.totalCases}</span></a>`).join("")
      : "";
    $("dv-ask").href = "/app/index.html?q=" + encodeURIComponent("Tell me about case " + c.crimeNo);
    $("dv-loc").style.display = c.lat != null ? "" : "none";
    $("dv").hidden = false;
    $("dv-ov").hidden = false;
    requestAnimationFrame(() => $("dv").classList.add("open"));
  }
  document.addEventListener("click", (e) => {
    const a = e.target.closest("a.no");
    if (!a) return;
    e.preventDefault();
    openCase(a.textContent.trim());
  });
  $("dv-x").onclick = closeDrawer;
  $("dv-ov").onclick = closeDrawer;
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("dv").hidden) closeDrawer(); });
  $("dv-loc").onclick = () => {
    if (!dvCase || dvCase.lat == null || !state.map) return;
    closeDrawer();
    state.map.flyTo({ center: [dvCase.lng, dvCase.lat], zoom: 12 });
    new maplibregl.Popup().setLngLat([dvCase.lng, dvCase.lat])
      .setHTML(`<b>${esc(dvCase.crimeNo)}</b><br>${esc(dvCase.majorHead)}<br>${esc(dvCase.incidentAt)}`)
      .addTo(state.map);
    document.querySelector("#map").scrollIntoView({ behavior: "smooth", block: "center" });
  };

  // ---------- boot ----------
  (async function boot() {
    try {
      const [summary, spikes] = await Promise.all([get("/summary"), get("/spikes")]);
      state.summary = summary;
      renderStamp(summary, "live");
      renderShell();
      renderKpis(summary, spikes);
      populateFilters(summary);
      await initMap();
      wireScrubber();
      wiWire();
      $("pat-print").onclick = () => {
        document.body.classList.add("print-patrol");
        window.print();
      };
      window.addEventListener("afterprint", () => document.body.classList.remove("print-patrol"));
      await refresh();
      setInterval(() => {
        refresh().then(() => {
          get("/summary").then((sm) => {
            renderStamp(sm, "checked " + new Date().toLocaleTimeString("en-IN", { hour12: false }));
          }).catch(() => {});
        }).catch(() => {});
      }, 90 * 1000);
    } catch (err) {
      $("app").innerHTML = `<div class="error-banner">Could not reach the analytics service.<br>${esc(err.message)}<br><br>Check that /server/analytics/health responds.</div>`;
      console.error(err);
    }
  })();
})();
</script>
</body>
